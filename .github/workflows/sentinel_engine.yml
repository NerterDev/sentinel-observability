name: Sentinel Synthetic Observability & Pages Deploy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      site:
        description: 'ID da loja específica para inspecionar (deixar vazio para todas)'
        required: false
        type: string
        default: ''
      skip_browser:
        description: 'Pular sonda Playwright (apenas inspeção de borda)'
        required: false
        type: boolean
        default: false

concurrency:
  group: sentinel-observability
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  observe-and-deploy:
    name: Sonda Sintética & Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Executar Motor de Observabilidade Sentinel
        env:
          WAF_BYPASS_TOKEN: ${{ secrets.WAF_BYPASS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ -n "${{ inputs.site }}" ]; then
            ARGS="$ARGS --site ${{ inputs.site }}"
          fi
          if [ "${{ inputs.skip_browser }}" = "true" ]; then
            ARGS="$ARGS --skip-browser"
          fi
          echo "A executar: python -m src.orchestrator $ARGS"
          python -m src.orchestrator $ARGS

      - name: Sincronizar Screenshots para Dashboard
        run: |
          mkdir -p dashboard/screenshots
          if [ -d "public/screenshots" ]; then
            cp -r public/screenshots/* dashboard/screenshots/ 2>/dev/null || true
          fi

      - name: Persistência GitOps de Telemetria
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dashboard/data public/screenshots
          git add dashboard/data/ public/screenshots/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração de telemetria para commitar."
          else
            git commit -m "chore(telemetry): update synthetic observability data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carregar Artefacto do Dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard'

      - name: Aguardar Propagação de Artefacto
        run: sleep 5

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

