objective: >
  Desenvolver a interface web Single Page Application (SPA) estática da plataforma
  de observabilidade (dashboard/index.html, styles.css e app.js) para publicação
  no GitHub Pages. A interface opera em modo escuro de alto contraste (Dark Mode),
  apresenta cartões de status instantâneo por loja, badges de infraestrutura
  (Rocket.net/Cloudflare, VPS, Bare-Metal), métricas consolidadas dos últimos 30 dias
  (uptime, taxa de sucesso de checkout, TTFB médio) e gráficos de série temporal.
  Inclui gaveta/modal de investigação forense detalhada com visualizador de screenshot,
  terminal de erros JS e logs de rede com falha. Cumpre estritamente o Contrato
  Universal de UX (.harness/invariants/ux_contract.yaml), cobrindo os 7 estados
  existenciais de interface, modularidade 4/8pt e navegação acessível por teclado.

canonical_path: "dashboard/app.js"
schema_authority: "src/models.py"

data_trace:
  ingress:
    sources:
      - "dashboard/data/current_status.json (estado instantâneo das lojas)"
      - "dashboard/data/history.json (série temporal de 30 dias)"
      - "dashboard/data/incidents/<incident_id>.json (dossiês individuais)"
    format: "JSON UTF-8 estático consumido via Fetch API no navegador"
  validation:
    rules:
      - "Validar presença e estrutura de dados de cada loja antes de renderizar"
      - "Garantir tratamento explícito dos 7 estados existenciais: EMPTY, LOADING, POPULATED, ZERO_RESULTS, PARTIAL_DEGRADED, ERROR, SUCCESS_FEEDBACK"
      - "Garantir conformidade com os tokens de design (Dark Theme) e escala 4/8pt"
  state:
    models:
      - "CurrentStatusPayload"
      - "HistoryPayload"
      - "StoreStatus"
      - "ForensicIncident"
    persistence_format: "Estado reativo em memória no cliente (SPA Vanilla JS)"
  egress:
    output: "Interface visual interativa renderizada no browser para visualização dos operadores"
    consumer: "Navegador web do utilizador (GitHub Pages)"

